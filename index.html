<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe Box</title>
<meta name="app-version" content="0.9.2-copyweb">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="A family recipe box: browse, cook, plan meals, and make shopping lists. Works offline.">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipe Box">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>@font-face{font-family:'Caveat';font-style:normal;font-weight:600;font-display:swap;src:url(./fonts/caveat-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Caveat';font-style:normal;font-weight:700;font-display:swap;src:url(./fonts/caveat-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Courier Prime';font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/courier-prime-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Courier Prime';font-style:normal;font-weight:700;font-display:swap;src:url(./fonts/courier-prime-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Libre Franklin';font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/libre-franklin-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Libre Franklin';font-style:normal;font-weight:500;font-display:swap;src:url(./fonts/libre-franklin-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Libre Franklin';font-style:normal;font-weight:600;font-display:swap;src:url(./fonts/libre-franklin-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Libre Franklin';font-style:normal;font-weight:700;font-display:swap;src:url(./fonts/libre-franklin-latin-700-normal.woff2) format('woff2')}</style>
<style>
:root{
  --desk:#DCE5EC;--paper:#FFFFFF;--paper-2:#F4F7FA;--edge:#C4CFD8;--rule:#D6E4EF;--rule-2:#9FC0DA;
  --ink:#1F2933;--ink-2:#3E4C59;--muted:#52606D;--faint:#7B8794;
  --red:#C8352F;--red-dk:#8E221D;--on-red:#FFFFFF;
  --peach:#FBD9C9;--peach-f:#7A3418;--sky:#D3E4F2;--sky-f:#24506E;--butter:#FBEBB5;--butter-f:#6B4E0E;
  --sage:#D6E8D3;--sage-f:#2E5A2B;--lilac:#E4DAF0;--lilac-f:#4E3470;--blush:#F7D6DF;--blush-f:#7D2A45;
  --mint:#D5ECE6;--mint-f:#225A4E;--apricot:#FCE1C4;--apricot-f:#7A4A12;--slate:#E3E8EE;--slate-f:#3B4754;
  --tab-off:#CBD5DE;--lift:0 2px 0 var(--edge),0 14px 30px rgba(31,41,51,.10);
  --hand:Caveat,'Segoe Print','Bradley Hand',cursive;--type:'Courier Prime','Courier New',Courier,monospace;--body:'Libre Franklin','Segoe UI',Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#161D23;--paper:#222B33;--paper-2:#1C242B;--edge:#33414D;--rule:#2C3944;--rule-2:#3F5566;
  --ink:#EEF2F5;--ink-2:#CBD5DE;--muted:#A3B0BC;--faint:#7B8794;--red:#F07A70;--red-dk:#B5453C;--on-red:#2A0D0B;
  --peach:#4A2E24;--peach-f:#FFD4C2;--sky:#22384A;--sky-f:#CDE3F5;--butter:#433A1E;--butter-f:#F7E3A6;--sage:#263A27;--sage-f:#CDE8C8;
  --lilac:#352B47;--lilac-f:#E2D4F5;--blush:#47262F;--blush-f:#F7CCD8;--mint:#1F3B35;--mint-f:#C3EBE0;--apricot:#45321C;--apricot-f:#F9D9B5;--slate:#2B333B;--slate-f:#D5DDE5;
  --tab-off:#26303A;--lift:0 2px 0 #0E1317,0 14px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#161D23;--paper:#222B33;--paper-2:#1C242B;--edge:#33414D;--rule:#2C3944;--rule-2:#3F5566;
  --ink:#EEF2F5;--ink-2:#CBD5DE;--muted:#A3B0BC;--faint:#7B8794;--red:#F07A70;--red-dk:#B5453C;--on-red:#2A0D0B;
  --peach:#4A2E24;--peach-f:#FFD4C2;--sky:#22384A;--sky-f:#CDE3F5;--butter:#433A1E;--butter-f:#F7E3A6;--sage:#263A27;--sage-f:#CDE8C8;
  --lilac:#352B47;--lilac-f:#E2D4F5;--blush:#47262F;--blush-f:#F7CCD8;--mint:#1F3B35;--mint-f:#C3EBE0;--apricot:#45321C;--apricot-f:#F9D9B5;--slate:#2B333B;--slate-f:#D5DDE5;
  --tab-off:#26303A;--lift:0 2px 0 #0E1317,0 14px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
a{color:var(--red)}a:hover{color:var(--red-dk)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky-f);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;line-height:1.1}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
@media (max-width:640px){.wrap{padding:0 16px}}
/* pastel sets */
.tg0{--tb:var(--peach);--tf:var(--peach-f)}.tg1{--tb:var(--blush);--tf:var(--blush-f)}.tg2{--tb:var(--sky);--tf:var(--sky-f)}.tg3{--tb:var(--apricot);--tf:var(--apricot-f)}.tg4{--tb:var(--mint);--tf:var(--mint-f)}
.tg5{--tb:var(--butter);--tf:var(--butter-f)}.tg6{--tb:var(--sage);--tf:var(--sage-f)}.tg7{--tb:var(--lilac);--tf:var(--lilac-f)}.tg8{--tb:var(--slate);--tf:var(--slate-f)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:3px solid var(--red);box-shadow:0 1px 0 var(--rule-2)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-top:10px;padding-bottom:10px}
.brand{text-decoration:none;color:var(--red);font-family:var(--hand);font-weight:700;font-size:38px;white-space:nowrap;line-height:1;padding-bottom:4px}
.brand:hover{color:var(--red-dk)}
.nav{display:flex;gap:12px}
.nav a{font-family:var(--type);font-weight:700;color:var(--muted);text-decoration:none;min-height:44px;display:flex;align-items:center;border-bottom:3px solid transparent;padding:0 2px}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--red)}
.search{flex:1 1 120px;min-width:0;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--rule-2);min-height:46px;color:var(--muted)}
.search:focus-within{border-bottom-color:var(--red)}
.search input{flex:1;border:0;background:transparent;font-size:17px;min-width:0;padding:10px 0;outline:none;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:3px;border:2px solid var(--ink);background:transparent;font-family:var(--type);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--paper-2);color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red);box-shadow:0 3px 0 var(--red-dk)}
.btn.primary:hover{background:var(--red-dk);border-color:var(--red-dk);color:var(--on-red)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-dk)}
.btn.ghost{border-color:transparent}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.small{min-height:40px;padding:0 12px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.icon-btn{width:44px;height:44px;padding:0;flex:none}
.btn[aria-pressed="true"].fav{background:var(--blush);border-color:var(--blush-f);color:var(--blush-f)}
.save-state{font-family:var(--type);font-size:14px;color:var(--sage-f);background:var(--sage);padding:6px 10px;border-radius:3px;font-weight:700}
main{padding:30px 0 72px}
@media (max-width:1240px){.save-state{display:none}}
@media (max-width:1020px){.top{position:static}.top .search{order:5;flex-basis:100%}}
@media (max-width:640px){.top{position:static}.top .search{order:5;flex-basis:100%}.save-state{display:none}.brand{font-size:34px}}

/* browse */
.hello{margin-bottom:18px}
.hello h1{font-family:var(--hand);font-weight:700;font-size:clamp(40px,5vw,56px);color:var(--ink)}
.hello p{margin:2px 0 0;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{min-height:42px;padding:0 14px;border-radius:3px;border:1.5px dashed var(--rule-2);background:var(--paper);font-family:var(--type);font-weight:700;font-size:15px;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--tb,var(--butter));border-color:var(--tf,var(--butter-f));color:var(--tf,var(--butter-f))}
@media (max-width:640px){.chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 18px;padding:0 16px 6px;scrollbar-width:none}.chip{flex:none}}
.tabs{display:flex;flex-wrap:wrap;gap:3px;padding:0 8px;position:relative;z-index:1}
.tab{flex:1 1 28px;max-width:52px;min-width:28px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:10px 10px 0 0;padding:6px 0;cursor:pointer;transform:translateY(8px);transition:transform .15s ease;box-shadow:inset 0 -7px 8px -6px rgba(0,0,0,.18)}
.tab:hover:not(:disabled){transform:translateY(3px)}
.tab b{font-family:var(--type);font-weight:700;font-size:18px;line-height:1}
.tab small{font-family:var(--type);font-size:11px;line-height:1;opacity:.85}
.p0{background:var(--peach);color:var(--peach-f)}.p1{background:var(--sky);color:var(--sky-f)}.p2{background:var(--butter);color:var(--butter-f)}.p3{background:var(--sage);color:var(--sage-f)}.p4{background:var(--lilac);color:var(--lilac-f)}
.tab[aria-pressed="true"]{background:var(--paper);color:var(--red);transform:translateY(1px);box-shadow:none}
.tab[aria-pressed="true"] b{font-size:21px}
.tab:disabled{background:var(--tab-off);color:var(--faint);cursor:default;box-shadow:none}
.drawer{background:var(--paper);border-radius:4px;margin-top:-1px;padding:24px 26px 28px;box-shadow:var(--lift)}
.tab .x{}@media (min-width:901px){.tabs{flex-wrap:nowrap}.tab{min-width:0}}
@media (max-width:640px){.drawer{padding:18px 14px}.tab{flex-basis:40px;max-width:44px}}
.drawer-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:18px}
.drawer-head h2{font-family:var(--hand);font-weight:700;font-size:68px;line-height:.8;color:var(--red)}
.drawer-head span{font-family:var(--type);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--edge);border-radius:4px;overflow:hidden;min-height:168px;box-shadow:0 3px 0 var(--edge);transition:transform .15s ease,box-shadow .15s ease}
.card:hover{color:var(--ink);transform:translateY(-3px) rotate(-.4deg);box-shadow:0 6px 0 var(--edge),0 12px 22px rgba(31,41,51,.12)}
.card-photo{height:110px;background:var(--paper-2)}
.card-photo img{width:100%;height:100%;object-fit:cover;display:block}
.card-title{display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 14px;background:var(--tb,var(--slate));color:var(--tf,var(--slate-f));border-bottom:2px solid var(--red);font-family:var(--hand);font-weight:700;font-size:27px;line-height:1}
.card-title span{flex:1}
.card-title svg{flex:none;color:var(--red)}
.card-body{flex:1;padding:4px 14px 12px;background-image:repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px);background-position:0 4px;font-family:var(--type);font-size:14px;line-height:28px;color:var(--ink-2);display:flex;flex-direction:column}
.card-body .ctag{font-weight:700;color:var(--tf,var(--ink))}
.hit{color:var(--sage-f);font-weight:700}
.tag{display:inline-block;padding:3px 10px;border-radius:3px;border:1.5px dashed var(--tf);background:var(--tb);color:var(--tf);font-family:var(--type);font-weight:700;font-size:14px;white-space:nowrap}
.empty{padding:24px 0;color:var(--muted)}
.empty p{margin:0 0 14px}

/* category sidebar */
.browse{display:flex;gap:26px;align-items:flex-start}
.catbar{}
.catbar h2{font-family:var(--hand);font-weight:700;font-size:34px;line-height:1;margin:0 0 10px 4px;color:var(--ink)}
.catbar ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.catbar hr{border:0;border-top:1.5px dashed var(--rule-2);margin:12px 18px 12px 4px}
.cat{width:100%;display:flex;align-items:center;gap:10px;min-height:42px;padding:0 26px 0 12px;border:0;background:var(--paper);color:var(--ink-2);font-family:var(--type);font-weight:700;font-size:15px;text-align:left;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);transition:transform .15s ease,background .15s ease}
.cat:hover{transform:translateX(4px)}
.cat .sw{flex:none;width:14px;height:14px;border-radius:50%;background:var(--tb);box-shadow:inset 0 0 0 1.5px var(--tf)}
.cat .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .cc{font-size:13px;color:var(--faint)}
.cat[aria-pressed="true"]{background:var(--tb);color:var(--tf);transform:translateX(10px)}
.cat[aria-pressed="true"] .cc{color:var(--tf)}
.cat[aria-pressed="true"] .sw{background:var(--red);box-shadow:none}
.rolo{flex:1;min-width:0}
@media (max-width:900px){.browse{display:block}.sidecol{position:static;width:auto;max-height:none;overflow:visible;padding:0;gap:14px;margin-bottom:22px}.catbar{position:static;width:auto;margin:0 -16px}.catbar h2{display:none}.catbar hr{display:none}
  .catbar{display:flex;overflow-x:auto;padding:0 16px 6px;gap:6px;scrollbar-width:none}.catbar ul{flex-direction:row;gap:6px}
  .cat{width:auto;white-space:nowrap;padding-right:24px}.cat:hover,.cat[aria-pressed="true"]{transform:none}}
@media (prefers-reduced-motion:reduce){.cat{transition:none}}

/* difficulty */
.hats{display:inline-flex;gap:1px;color:var(--faint)}
.hat{display:inline-flex;color:var(--rule-2)}
.hat.on{color:var(--red)}
.hat.on svg{fill:var(--peach)}
.hats.mini svg{width:15px;height:15px}
.hatpick{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.hatpick .hat{width:40px;height:40px;border:0;background:transparent;border-radius:3px;cursor:pointer;display:grid;place-items:center;padding:0}
.hatpick .hat svg{width:26px;height:26px}
.hatpick .hat:hover{background:var(--paper-2);color:var(--red)}
.hatword{margin-left:8px;font-family:var(--type);font-size:15px}
.dfact .hatpick .hat{width:34px;height:34px}.dfact .hatpick .hat svg{width:22px;height:22px}
.cdiff{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.cdiff .hat.on svg{fill:var(--tb,var(--peach))}
.sidecol{flex:none;width:276px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);max-height:calc(100vh - 110px);overflow:auto;padding-right:12px;scrollbar-width:thin;display:flex;flex-direction:column;gap:22px}
.diffbox{background:var(--paper);border-radius:4px;box-shadow:0 2px 0 var(--edge);padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;margin-bottom:22px}
.diffbox h2{font-family:var(--hand);font-weight:700;font-size:30px;line-height:1}
.dslide{flex:0 1 260px;min-width:200px;padding-top:8px}
.dsum{min-width:170px}
.dual{position:relative;height:36px;--a:0;--b:1}
.dual::before{content:"";position:absolute;left:11px;right:11px;top:16px;height:5px;border-radius:3px;background:var(--rule-2)}
.dual::after{content:"";position:absolute;top:16px;height:5px;border-radius:3px;background:var(--red);left:calc(11px + (100% - 22px) * var(--a));width:calc((100% - 22px) * (var(--b) - var(--a)))}
.dual input{position:absolute;inset:0;width:100%;margin:0;background:transparent;-webkit-appearance:none;appearance:none;pointer-events:none;z-index:1;height:36px}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:24px;height:24px;border-radius:50%;background:var(--paper);border:3px solid var(--red);cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.dual input::-moz-range-thumb{pointer-events:auto;width:18px;height:18px;border-radius:50%;background:var(--paper);border:3px solid var(--red);cursor:grab}
.dual input::-webkit-slider-runnable-track{background:transparent;height:36px}
.dual input::-moz-range-track{background:transparent}
.dual input:focus-visible{outline:none}
.dual input:focus-visible::-webkit-slider-thumb{outline:3px solid var(--sky-f);outline-offset:2px}
.dends{display:flex;justify-content:space-between;font-family:var(--type);font-size:12px;color:var(--muted);margin-top:-6px}
.dscale > span{opacity:.45;display:flex;width:20%;justify-content:center}
.dscale > span.in{opacity:1}
.dscale .hats{flex-direction:column-reverse;gap:0}
.dscale .hats .hat:not(.on){display:none}
.dscale .hats.mini svg{width:13px;height:13px}
.dsum{margin:0;font-family:var(--type);font-weight:700;font-size:15px;color:var(--ink)}
.dunr{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer;min-height:32px}
.dunr input{accent-color:var(--red);width:18px;height:18px;margin-top:1px;flex:none}

/* nav badge, plan, shop, import */
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:var(--red);color:var(--on-red);font-size:12px}
.linkbtn{border:0;background:none;padding:0;color:var(--red);font-family:var(--type);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;min-height:32px}
.plan-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.plan-head h1{font-family:var(--hand);font-weight:700;font-size:56px;line-height:1}
.wkname{display:flex;flex-direction:column;align-items:center;min-width:170px;font-family:var(--type)}
.wkname span{font-size:14px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.day{background:var(--paper);border-radius:4px;box-shadow:var(--lift);overflow:hidden;display:flex;flex-direction:column;--tb:var(--slate);--tf:var(--slate-f)}
.day.today{--tb:var(--butter);--tf:var(--butter-f)}
.day .band{padding:10px 16px 6px}.day .band h2{font-size:32px}
.day-body{padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.meal{display:grid;grid-template-columns:1fr auto;align-items:center;background:var(--tb);color:var(--tf);border:1.5px dashed var(--tf);border-radius:3px;padding:6px 4px 6px 10px}
.meal .mlabel{grid-column:1;font-family:var(--type);font-size:12px;font-weight:700;opacity:.85}
.meal a{grid-column:1;color:inherit;text-decoration:none;font-weight:600;line-height:1.3}
.meal a:hover{text-decoration:underline}
.meal button{grid-column:2;grid-row:1 / span 2;width:36px;height:36px;border:0;background:transparent;color:inherit;font-size:20px;cursor:pointer;border-radius:3px}
.meal button:hover{background:rgba(0,0,0,.08)}
.nothing{margin:0}
.addmeal{align-self:flex-start;margin-top:auto;border-style:dashed;border-color:var(--rule-2)}
.daypick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}

.have{margin-top:10px;border-top:1.5px dashed var(--rule-2);padding-top:12px}

.cartwrap{position:relative}
.cartbtn{position:relative;width:48px;height:48px;border:0;border-radius:3px;background:transparent;color:var(--ink-2);cursor:pointer;display:grid;place-items:center}
.cartbtn:hover,.cartbtn.on{background:var(--sky);color:var(--sky-f)}
.cbadge{position:absolute;top:2px;right:0;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:var(--on-red);font-family:var(--type);font-weight:700;font-size:12px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--paper)}
.cbadge.ok{background:var(--sage-f);color:var(--paper)}
.cartpop{position:absolute;right:0;top:calc(100% + 10px);z-index:40;width:300px;background:var(--paper);border-radius:4px;border-top:4px solid var(--red);box-shadow:0 18px 40px rgba(31,41,51,.25),0 0 0 1px var(--edge);padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.cartpop h2{font-family:var(--hand);font-weight:700;font-size:32px;line-height:1}
.cartpop p{margin:0;color:var(--ink-2)}
.cartpop .btn{width:100%}
@media (max-width:640px){.cartpop{position:fixed;left:12px;right:12px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}}
.toast{display:flex;align-items:center;gap:14px}
.toast button{border:0;background:var(--butter);color:var(--butter-f);font-family:var(--type);font-weight:700;border-radius:3px;min-height:36px;padding:0 12px;cursor:pointer}

/* print designer */
#pmeasure{position:absolute;left:-9999px;top:0;visibility:hidden}
.printui{display:flex;gap:28px;align-items:flex-start}
.pcontrols{flex:none;width:330px;background:var(--paper);border-radius:4px;box-shadow:var(--lift);padding:18px 20px 22px;display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);max-height:calc(100vh - 110px);overflow:auto}
.pcontrols h1{font-family:var(--hand);font-weight:700;font-size:48px;line-height:1}
.fmtpick{display:flex;flex-direction:column;gap:6px}
.fmtpick button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border:1.5px solid var(--rule-2);border-radius:3px;background:var(--paper);font-family:var(--type);font-weight:700;font-size:14px;text-align:left;cursor:pointer}
.fmtpick button[aria-pressed="true"]{background:var(--peach);border-color:var(--peach-f);color:var(--peach-f)}
.fmtico{width:auto;height:26px;max-width:40px;border:2px solid currentColor;border-radius:2px;flex:none;display:block}
.fmtpick button span:last-child{flex:1}
.seg.wrap{flex-wrap:wrap}
.pcontrols .seg button{font-size:14px;min-height:42px;padding:0 12px}
.pfields{display:flex;flex-direction:column;gap:2px}
.pfields label{display:flex;align-items:center;gap:10px;min-height:38px;cursor:pointer}
.pfields input{width:18px;height:18px;accent-color:var(--red)}
.pstatus{background:var(--sage);color:var(--sage-f);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.pstatus b{font-family:var(--type);font-size:16px}
.pstatus .warn{color:var(--red);font-weight:600}
.ppreview{flex:1;min-width:0}
#psheets{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.sheetwrap{position:relative;overflow:hidden;box-shadow:0 2px 0 var(--edge),0 12px 26px rgba(31,41,51,.14);background:#fff}
.psheet{transform-origin:top left;background:#fff;position:relative}
.sheetcap{font-family:var(--type);font-size:13px;color:var(--muted);min-height:18px;margin-bottom:10px}
.psheet.tiled .slot{position:absolute;outline:1px dashed #9AA5B1;outline-offset:0}
.psheet.tiled .slot .pgin{box-shadow:none}
@media (max-width:900px){.printui{flex-direction:column}.pcontrols{position:static;width:100%;max-height:none}}
/* printed page content (always light, real colors) */
.pgin{box-sizing:border-box;position:relative;overflow:hidden;background:#fff;color:#1F2933;font-family:'Libre Franklin',Helvetica,Arial,sans-serif;line-height:1.35}
.pgin .pb-title{font-family:Caveat,'Segoe Print',cursive;font-weight:700;font-size:2.6em;line-height:1;padding-bottom:.12em;margin-bottom:.35em;border-bottom:2px solid #C8352F}
.pgin.look-card .pb-title{background:#FBEBB5;color:#6B4E0E;margin:-.2em -.4em .45em;padding:.15em .4em .12em}
.pgin.look-plain .pb-title{color:#111;border-bottom-color:#111}
.pgin .pb-meta{display:flex;flex-wrap:wrap;gap:.2em 1.2em;font-size:.9em;margin-bottom:.6em;color:#3E4C59}
.pgin .pb-meta b{font-family:'Courier Prime',Courier,monospace;font-weight:700;margin-right:.3em;color:#52606D}
.pgin .pb-photo{margin-bottom:.6em}.pgin .pb-photo img{display:block;max-width:100%;max-height:2.3in;object-fit:cover;border-radius:2px}
.pgin .pb-desc{margin:0 0 .6em;font-style:italic;color:#3E4C59}
.pgin .pb-sec{font-family:Caveat,'Segoe Print',cursive;font-weight:700;font-size:1.7em;line-height:1;margin:.35em 0 .2em;color:#C8352F}
.pgin .pb-sec.small{font-size:1.4em}
.pgin.look-plain .pb-sec{color:#111}
.pgin .pb-grp{font-weight:700;margin:.4em 0 .1em;color:#24506E}
.pgin.look-plain .pb-grp{color:#111}
.pgin .pb-ing{padding:.12em 0;border-bottom:1px solid #D6E4EF}
.pgin.look-plain .pb-ing{border-bottom-color:#E5E5E5}
.pgin .pb-ing span{color:#52606D}
.pgin .pb-row{display:grid;grid-template-columns:1fr 1fr;column-gap:1.4em}
.pgin .pb-step{display:flex;gap:.6em;padding:.25em 0;border-bottom:1px solid #D6E4EF}
.pgin.look-plain .pb-step{border-bottom-color:#E5E5E5}
.pgin .pb-n{flex:none;min-width:1.4em;font-family:Caveat,'Segoe Print',cursive;font-weight:700;font-size:1.35em;line-height:1;color:#C8352F}
.pgin.look-plain .pb-n{color:#111}
.pgin .pb-p{margin:0 0 .4em}
.pgin .pb-foot{position:absolute;right:.6em;bottom:.35em;font-family:'Courier Prime',Courier,monospace;font-size:.75em;color:#7B8794}
@media print{
  body.printing-recipe{background:#fff}
  body.printing-recipe .top,body.printing-recipe .no-print,body.printing-recipe .sheetcap,body.printing-recipe .toast{display:none!important}
  body.printing-recipe main{padding:0}body.printing-recipe .wrap{max-width:none;padding:0}
  body.printing-recipe .printui{display:block}
  body.printing-recipe #psheets{display:block;gap:0}
  body.printing-recipe .sheetwrap{width:auto!important;height:auto!important;box-shadow:none;overflow:visible;break-after:page;page-break-after:always}
  body.printing-recipe .sheetwrap.last{break-after:auto;page-break-after:auto}
  body.printing-recipe .psheet{transform:none!important}
  .pgin,.pgin *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* index */

.paper-head h1{font-family:var(--hand);font-weight:700;font-size:52px;line-height:1;color:var(--tf,var(--butter-f))}
.seg{display:flex;gap:6px}
.seg button{min-height:42px;padding:0 14px;border:2px solid var(--ink-2);border-radius:3px;font-family:var(--type);font-weight:700;cursor:pointer;background:var(--paper)}

.jump{display:flex;flex-wrap:wrap;gap:4px;padding:16px 0 6px}

.side{font-family:var(--type);font-size:13px;color:var(--muted);white-space:nowrap}

/* recipe */
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--type);font-weight:700;text-decoration:none;min-height:44px;margin-bottom:10px}

.tagrow{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- storage ---------- */
let DB=null, persistOK=true;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('recipe-box',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}})}
async function kvGet(k){if(!DB)return null;return new Promise(res=>{try{const t=DB.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result??null);t.onerror=()=>res(null);}catch(e){res(null)}})}
async function kvSet(k,v){if(!DB)return false;return new Promise(res=>{try{const tx=DB.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false)}})}
let saveTimer=null;
function persist(){clearTimeout(saveTimer);setSaving('Saving…');saveTimer=setTimeout(async()=>{const ok=await kvSet('box',S.box);persistOK=ok;setSaving(ok?'Saved':'Not saved');if(typeof scheduleSync==='function'&&!SY.applying)scheduleSync();},300)}
function setSaving(t){const el=$('#saveState');if(el)el.textContent=t}

/* ---------- state ---------- */
const S={box:null,letter:null,tag:'All',q:'',dmin:1,dmax:5,dunr:true,indexMode:'az',servings:{},cook:null,draft:null};
function freshBox(withRecipes){const b=clone(SEED);if(!withRecipes){b.recipes=[]}b.recipes.forEach(r=>{r.created=r.created||nowISO();r.updated=r.updated||r.created;});return b}
const byId=id=>S.box?S.box.recipes.find(r=>r.id===id):null;

/* ---------- helpers ---------- */
const NUMRE=/^\d/;
function fileLetter(name){const c=(name||'').trim().charAt(0).toUpperCase();return /\d/.test(c)?'#':(/[A-Z]/.test(c)?c:'#')}
const collator=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
const sortRecipes=a=>a.slice().sort((x,y)=>collator.compare(x.name,y.name));
const TAGPAL={'Sauces & Dips':0,'Dessert':1,'Cocktails & Drinks':7,'Meat':3,'Pork':3,'Fish & Seafood':4,'Poultry':5,'Breakfast':5,'Vegetables':6,'Salad':6,'Vegetarian':6,'Pastas':3,'Rice':5,'Bread and Pastry':0,'Soup':2,'Appetizers':1,'Beans':6,'Spring Rolls':4};
function tagClass(t){if(t in TAGPAL)return 'tg'+TAGPAL[t];let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))>>>0;return 'tg'+(h%9)}
function mainTag(r){return (r.tags||[]).find(t=>t!=='Vegetarian')||(r.tags||[])[0]||''}
function fmtMin(m){if(!m)return '';const h=Math.floor(m/60),mm=m%60;return (h?h+' hr':'')+(h&&mm?' ':'')+(mm?mm+' min':'')}
const FR=[[0,''],[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞'],[1,'']];
function fmt(v){if(v==null||isNaN(v))return '';if(v>=20)return String(Math.round(v));let w=Math.floor(v+1e-9),r=v-w,b=FR[0];for(const o of FR)if(Math.abs(o[0]-r)<Math.abs(b[0]-r))b=o;
  if(b[0]===1){w+=1;b=FR[0]}if(!w&&!b[1])return '⅛';return (w?String(w):'')+(b[1]?(w?' ':'')+b[1]:'')}
const PL={cup:'cups',clove:'cloves',head:'heads',bunch:'bunches',can:'cans',stick:'sticks',bottle:'bottles',slice:'slices',package:'packages',pint:'pints',quart:'quarts',gallon:'gallons',liter:'liters',pinch:'pinches',dash:'dashes',splash:'splashes'};
const COUNTU=new Set(['clove','head','can','stick','bottle','slice','package','bunch']);
function amountText(l,f){let n='',big=0;
  if(l.a!=null){const cnt=f!==1&&(!l.u||COUNTU.has(l.u));const rd=x=>cnt&&x>=1?Math.max(.5,Math.round(x*2)/2):x;const a=rd(l.a*f),b=l.b!=null?rd(l.b*f):null;n=fmt(a)+(b!=null?' to '+fmt(b):'');big=b!=null?b:a}
  else if(l.q){n=l.q}
  const u=l.u?(big>1&&PL[l.u]?PL[l.u]:l.u):'';return (n+(u?' '+u:'')).trim()}
function parseNum(s){s=s.trim();let m;
  if((m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/)))return +m[1]+ +m[2]/ +m[3];
  if((m=s.match(/^(\d+)\s*-\s*(\d+)\/(\d+)$/)))return +m[1]+ +m[2]/ +m[3];
  if((m=s.match(/^(\d+)\/(\d+)$/)))return +m[1]/ +m[2];
  const u={'½':.5,'⅓':1/3,'⅔':2/3,'¼':.25,'¾':.75,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
  if((m=s.match(/^(\d*)\s*([½⅓⅔¼¾⅛⅜⅝⅞])$/)))return (m[1]?+m[1]:0)+u[m[2]];
  if(/^\d*\.?\d+$/.test(s))return parseFloat(s);return null}
function parseQty(text){const t=(text||'').trim();if(!t)return {};const low=t.toLowerCase();
  if(low==='to taste'||low==='as needed')return {n:low};
  const m=t.match(/^(.+?)\s*(?:to|–|-(?!\s*\d+\/))\s*(.+)$/);
  if(m){const a=parseNum(m[1]),b=parseNum(m[2]);if(a!=null&&b!=null)return {q:t,a,b}}
  const v=parseNum(t);if(v!=null)return {q:t,a:v};return {q:t}}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function closest(name){const k=name.trim().toLowerCase();if(!k)return null;let best=null,bd=99;
  for(const x of S.box.ingredients){const xl=x.toLowerCase();if(xl===k)return {exact:x};
    const d=lev(k.replace(/\s|-/g,''),xl.replace(/\s|-/g,''));const lim=k.length<=5?1:2;
    const plural=(xl===k+'s'||k===xl+'s'||xl===k+'es'||k===xl+'es');
    if((d<=lim||plural)&&d<bd){bd=d;best=x}}
  return best?{near:best}:null}
function canonical(name){const c=closest(name);return c&&c.exact?c.exact:name.trim()}
function timersIn(text){const out=[];const re=/(\d+(?:\.\d+)?)(?:\s*(?:to|-|–)\s*(\d+(?:\.\d+)?))?\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/gi;let m;
  while((m=re.exec(text))&&out.length<3){const v=parseFloat(m[2]||m[1]);const u=m[3].toLowerCase();const sec=u.startsWith('h')?v*3600:u.startsWith('s')?v:v*60;if(sec>=10&&sec<=86400)out.push({sec:Math.round(sec),label:m[0].replace(/\s+/g,' ')})}return out}
function splitSentences(t){return t.split(/(?<=[.!?])\s+(?=[A-Z0-9*(])/).map(s=>s.trim()).filter(Boolean)}

const DIFF=['Very easy','Easy','Medium','Challenging','Advanced'];
const HAT='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17.5h10V21H7z"/><path d="M7 17.5C4.5 17 3 14.9 3 12.6a4 4 0 0 1 5-3.9A4.5 4.5 0 0 1 12 5.5a4.5 4.5 0 0 1 4 3.2 4 4 0 0 1 5 3.9c0 2.3-1.5 4.4-4 4.9"/></svg>';

/* ---------- shell ---------- */
function route(){const h=location.hash.slice(1)||'/';const p=h.split('/').filter(Boolean);return {name:p[0]||'browse',id:p[1]?decodeURIComponent(p[1]):null}}
function go(h){if(location.hash==='#'+h)render();else location.hash=h}
function header(active){return `<header class="top"><div class="wrap">
<a class="brand" href="#/">Recipe Box</a>
<nav class="nav" aria-label="Main"><a href="#/" ${active==='browse'?'aria-current="page"':''}>Browse</a><a href="#/index" ${active==='index'?'aria-current="page"':''}>Index</a><a href="#/plan" ${active==='plan'?'aria-current="page"':''}>Meal plan</a></nav>

<span class="save-state" id="saveState" title="Your recipes are saved in this browser on this device">${persistOK?'Saved':'Not saved'}</span>
<div class="cartwrap syncwrap-outer"><span class="syncwrap">${syncButton()}</span></div><div class="cartwrap">${cartButton(active==='shop')}</div>
<button class="btn icon-btn ghost" data-act="settings" aria-label="Backup and settings">${I.gear}</button>
<a class="btn primary" href="#/new">${I.plus}Add recipe</a></div></header>`}

function botnav(active,rn){const it=(h,ic,l,on)=>`<a href="${h}" ${on?'aria-current="page"':''}>${ic}<span>${l}</span></a>`;
  return `<nav class="botnav" aria-label="Main">${it('#/',I.box,'Browse',active==='browse')}${it('#/index','<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>','Index',active==='index')}${it('#/plan',I2.cal.replace('width="18" height="18"','width="22" height="22"'),'Meal plan',active==='plan')}${it('#/new','<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>','Add',rn==='new')}</nav>`}
function render(){const r=route();const app=$('#app');if(!S.box){app.innerHTML=viewWelcome();return}
  if(r.name==='import'&&r.id){const d=draftFromPayload(r.id);if(d){d.__for='new';S.draft=d;S.keepDraft=true;location.replace('#/new');tryGrabPhoto(d.__img);toast(`Found ${d.ing.filter(l=>l.i).length} ingredients and ${d.steps.filter(s=>s.t).length} steps`);return}toast('That link did not include a recipe');location.replace('#/import');return}const keepFocus=document.activeElement&&document.activeElement.id==='q';const caret=keepFocus?document.activeElement.selectionStart:null;
  let body='';
  if(r.name==='r'){const rec=byId(r.id);body=rec?viewRecipe(rec):notFound();}
  else if(r.name==='edit'||r.name==='new'){body=editor(r.name==='new'?null:byId(r.id));}
  else if(r.name==='index'){body=viewIndex();}
  else if(r.name==='plan'){body=viewPlan();}
  else if(r.name==='shop'){body=viewShop();}
  else if(r.name==='import'){body=viewImport();}
  else if(r.name==='print'){const rec=byId(r.id);body=rec?viewPrint(rec):notFound();}
  else body=viewBrowse();
  const active=['index','browse','plan','shop'].includes(r.name)?r.name:'';
  app.innerHTML=header(active)+'<main><div class="wrap">'+(['browse','index','plan','shop'].includes(r.name)?installBanner():'')+body+'</div></main>'+botnav(active,r.name);
  if(keepFocus){const q=$('#q');q.focus();try{q.setSelectionRange(caret,caret)}catch(e){}}
  if(r.name==='edit'||r.name==='new')bindEditor();
  if(r.name==='browse'&&isPhone()){const t=$('.tab[aria-pressed="true"]');if(t){const tb=t.parentElement;tb.scrollLeft=t.offsetLeft-tb.clientWidth/2+t.clientWidth/2}}
  if(r.name==='print'&&byId(r.id))drawPrint(byId(r.id));
  document.body.classList.toggle('printing-recipe',r.name==='print');
  document.title=(r.name==='r'&&byId(r.id)?byId(r.id).name+' – ':'')+'Recipe Box';
}
function notFound(){return `<div class="empty"><p>That recipe isn't in this box anymore.</p><a class="btn" href="#/">Back to recipes</a></div>`}

/* ---------- browse ---------- */
function matches(rec,q){if(!q)return {ok:true};const n=rec.name.toLowerCase();if(n.includes(q))return {ok:true};
  const hit=(rec.ing||[]).find(l=>l.i&&l.i.toLowerCase().includes(q));if(hit)return {ok:true,via:hit.i};
  if((rec.tags||[]).some(t=>t.toLowerCase().includes(q)))return {ok:true};
  if((rec.src||'').toLowerCase().includes(q))return {ok:true,via:'from '+rec.src};return {ok:false}}
function card(rec,via){const t=mainTag(rec);const cls=tagClass(t);const bits=[rec.min?fmtMin(rec.min):'',rec.src?'from '+rec.src:''].filter(Boolean);const dl=rec.diff?`<span class="cdiff">${hats(rec.diff,'mini')}<span>${DIFF[rec.diff-1]}</span></span>`:'';
  return `<a class="card ${cls}" href="#/r/${encodeURIComponent(rec.id)}">${rec.photo?`<div class="card-photo"><img src="${rec.photo}" alt=""></div>`:''}<div class="card-title"><span>${esc(rec.name)}</span>${rec.fav?`<span class="sr">Favorite</span>${I.heartF}`:''}</div>
<div class="card-body">${via?`<span class="hit">Has ${esc(via)}</span>`:''}${t?`<span class="ctag">${esc(t)}</span>`:''}${dl}${bits.map(b=>`<span>${esc(b)}</span>`).join('')}</div></a>`}
function diffSummary(){if(S.dmin===1&&S.dmax===5)return 'Any difficulty';return S.dmin===S.dmax?DIFF[S.dmin-1]+' only':DIFF[S.dmin-1]+' to '+DIFF[S.dmax-1]}
function diffBox(all){const unr=all.filter(r=>!r.diff).length;const pct=v=>String((v-1)/4);
  const open=!isPhone()||S.diffOpen||S.dmin>1||S.dmax<5||!S.dunr;
  return `<details class="diffbox" ${open?'open':''} id="diffdet"><summary><h2 id="dh">Difficulty</h2><span class="dsumm">${diffSummary()}</span></summary><div class="dbody"><div class="dslide">
<div class="dual" style="--a:${pct(S.dmin)};--b:${pct(S.dmax)}"><label class="sr" for="dmin">Easiest level to show</label><input type="range" id="dmin" min="1" max="5" step="1" value="${S.dmin}" aria-valuetext="${DIFF[S.dmin-1]}"><label class="sr" for="dmax">Hardest level to show</label><input type="range" id="dmax" min="1" max="5" step="1" value="${S.dmax}" aria-valuetext="${DIFF[S.dmax-1]}"></div>
<div class="dends" aria-hidden="true"><span>Very easy</span><span>Advanced</span></div></div>
<p class="dsum" id="dsum">${diffSummary()}</p>
<label class="dunr"><input type="checkbox" id="dunr" ${S.dunr?'checked':''}> Include recipes not rated yet${unr?` (${unr})`:''}</label>
${(S.dmin>1||S.dmax<5||!S.dunr)?`<button class="btn small" data-act="dreset">Show all difficulties</button>`:''}</div></details>`}
function viewBrowse(){const all=S.box.recipes;const q=S.q.trim().toLowerCase();
  const tagsUsed=[...new Set(all.flatMap(r=>r.tags||[]))].sort(collator.compare);
  const dOn=S.dmin>1||S.dmax<5||!S.dunr;const passD=r=>!dOn||(r.diff?(r.diff>=S.dmin&&r.diff<=S.dmax):S.dunr);
  const base=all.filter(r=>(S.tag==='All'||(S.tag==='Favorites'?r.fav:(r.tags||[]).includes(S.tag)))&&passD(r));
  const letters=['#',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];const counts={};letters.forEach(L=>counts[L]=0);base.forEach(r=>counts[fileLetter(r.name)]++);
  if(!S.letter||(!counts[S.letter]&&!q)){S.letter=letters.slice(1).find(L=>counts[L])||(counts['#']?'#':'A')}
  let list,heading,sub;
  if(q){list=sortRecipes(base).map(r=>({r,m:matches(r,q)})).filter(x=>x.m.ok);heading='“'+esc(S.q.trim())+'”';sub=list.length+(list.length===1?' match':' matches')}
  else{list=sortRecipes(base.filter(r=>fileLetter(r.name)===S.letter)).map(r=>({r,m:{}}));heading=S.letter==='#'?'#':S.letter;sub=list.length+(list.length===1?' recipe':' recipes')+(S.tag!=='All'?' in '+esc(S.tag):'')+(dOn?', '+esc(diffSummary()).toLowerCase():'')}
  if(!all.length)return `<div class="hello"><div><h1>Your recipe box is empty</h1><p>Add your first recipe, or restore a backup from the settings menu.</p></div></div><a class="btn primary" href="#/new">${I.plus}Add your first recipe</a>`;
  const cnt=c=>c==='All'?all.length:c==='Favorites'?all.filter(r=>r.fav).length:all.filter(r=>(r.tags||[]).includes(c)).length;

function tagboxInner(){const d=S.draft;return d.tags.map(t=>`<span class="tchip ${tagClass(t)}">${esc(t)}<button type="button" data-ed="untag" data-v="${esc(t)}" aria-label="Remove category ${esc(t)}">×</button></span>`).join('')+
`<input id="tagIn" class="addpill" role="combobox" aria-expanded="false" aria-controls="tagMenu" aria-autocomplete="list" autocomplete="off" aria-label="Add a category" placeholder="+ Add category">`}
function ingRow(l,i,n){const tools=`<div class="tools"><button type="button" class="btn small icon-btn" data-ed="ingup" data-i="${i}" aria-label="Move up" ${i?'':'disabled'}>${I.up}</button><button type="button" class="btn small icon-btn" data-ed="ingdown" data-i="${i}" aria-label="Move down" ${i<n-1?'':'disabled'}>${I.down}</button><button type="button" class="btn small icon-btn" data-ed="ingdel" data-i="${i}" aria-label="Remove">${I.trash}</button></div>`;
  if(l.h!=null)return `<div class="erow h" data-i="${i}"><label class="sr" for="h${i}">Section heading</label><input class="in" id="h${i}" data-f="h" value="${esc(l.h)}" placeholder="Section heading, like For the sauce" style="font-weight:700">${tools}</div>`;
  return `<div class="erow" data-i="${i}"><div class="qcell"><label class="sr" for="q${i}">Amount</label><input class="in" id="q${i}" data-f="qt" value="${esc(l.qt??'')}" placeholder="Amount"></div>
<div class="unitcell"><label class="sr" for="u${i}">Unit</label><input class="in" id="u${i}" data-f="u" value="${esc(l.u||'')}" placeholder="unit" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="um${i}" aria-autocomplete="list"><div class="tagmenu" id="um${i}" role="listbox" aria-label="Unit suggestions" hidden></div></div>
<div class="ingname"><label class="sr" for="i${i}">Ingredient</label><input class="in" id="i${i}" data-f="i" value="${esc(l.i||'')}" placeholder="Ingredient" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="im${i}" aria-autocomplete="list"><div class="tagmenu" id="im${i}" role="listbox" aria-label="Ingredient suggestions" hidden></div></div>
<div class="noteIn"><label class="sr" for="n${i}">Note</label><input class="in" id="n${i}" data-f="n" value="${esc(l.n||'')}" placeholder="Note, like chopped"></div>${tools}<div class="hint" id="hint${i}" hidden></div></div>`}
function stepRows(d){let k=0;return d.steps.map((s,i)=>{const isH=s.h!=null;const sent=!isH&&splitSentences(s.t||'').length>1;
  return `<div class="srow ${isH?'h':''}"><span class="num" aria-hidden="true">${isH?'§':++k}</span><div><label class="sr" for="s${i}">${isH?'Section heading':'Step '+k}</label>${isH?`<input class="in" id="s${i}" data-s="${i}" value="${esc(s.h)}" placeholder="Section heading, like For the icing" style="font-weight:700">`:`<textarea class="in" id="s${i}" data-s="${i}" rows="2">${esc(s.t||'')}</textarea>`}
${sent?`<button type="button" class="btn small ghost" data-ed="split" data-i="${i}" style="margin-top:4px;padding-left:0;color:var(--herb)">Split into separate steps</button>`:''}</div>
<div class="tools" style="display:flex;gap:4px"><button type="button" class="btn small icon-btn" data-ed="stup" data-i="${i}" aria-label="Move up" ${i?'':'disabled'}>${I.up}</button><button type="button" class="btn small icon-btn" data-ed="stdown" data-i="${i}" aria-label="Move down" ${i<d.steps.length-1?'':'disabled'}>${I.down}</button><button type="button" class="btn small icon-btn" data-ed="stdel" data-i="${i}" aria-label="Remove">${I.trash}</button></div></div>`}).join('')}
function readForm(){const d=S.draft;const v=id=>($('#'+id)||{}).value??'';
  d.name=v('f-name');d.desc=v('f-desc');d.min=v('f-min');d.serv=v('f-serv');d.yld=v('f-yld');d.src=v('f-src');d.link=v('f-link');d.ut=v('f-ut');d.notes=v('f-notes');

function rerenderRows(){const d=S.draft;$('#ingRows').innerHTML=d.ing.map((l,i)=>ingRow(l,i,d.ing.length)).join('');$('#stepRows').innerHTML=stepRows(d)}
function showHint(i){const inp=$('#i'+i),h=$('#hint'+i);if(!inp||!h)return;const val=inp.value.trim();if(!val){h.hidden=true;return}
  const c=closest(val);if(c&&c.exact){if(inp.value!==c.exact){inp.value=c.exact;S.draft.ing[i].i=c.exact}h.hidden=true;return}
  if(c&&c.near){h.hidden=false;h.innerHTML=`Did you mean <button type="button" data-ed="usehint" data-i="${i}" data-v="${esc(c.near)}">${esc(c.near)}</button>? <span>Or keep “${esc(val)}” as a new ingredient.</span>`;return}
  h.hidden=false;h.innerHTML=`“${esc(val)}” will be added as a new ingredient.`}
function bindEditor(){const f=$('#ed');if(!f)return;
  f.addEventListener('submit',e=>{e.preventDefault();saveDraft()});
  f.addEventListener('change',e=>{const t=e.target;if(t.dataset.f==='i'){const i=+t.closest('.erow').dataset.i;S.draft.ing[i].i=t.value;showHint(i)}
    if(t.id==='f-photo'&&t.files&&t.files[0])loadPhoto(t.files[0])});
  f.addEventListener('click',e=>{const b=e.target.closest('[data-ed]');if(!b)return;readForm();const d=S.draft,i=+b.dataset.i,a=b.dataset.ed;const mv=(arr,j,k)=>{if(k<0||k>=arr.length)return;[arr[j],arr[k]]=[arr[k],arr[j]]};
    if(a==='adding')d.ing.push({i:'',qt:''});if(a==='addhead')d.ing.push({h:''});
    if(a==='ingup')mv(d.ing,i,i-1);if(a==='ingdown')mv(d.ing,i,i+1);if(a==='ingdel')d.ing.splice(i,1);
    if(a==='addstep')d.steps.push({t:''});if(a==='addshead')d.steps.push({h:''});
    if(a==='stup')mv(d.steps,i,i-1);if(a==='stdown')mv(d.steps,i,i+1);if(a==='stdel')d.steps.splice(i,1);
    if(a==='split'){const parts=splitSentences(d.steps[i].t);d.steps.splice(i,1,...parts.map(t=>({t})))}
    if(a==='usehint'){d.ing[i].i=b.dataset.v;rerenderRows();return}
    if(a==='diff'){const v=+b.dataset.v;d.diff=d.diff===v?0:v;const hp=b.closest('.hatpick');hp.outerHTML=hatPicker(d.diff,'data-ed');return}

    if(['adding','addhead','addstep','addshead'].includes(a)){rerenderRows();const last=a==='adding'||a==='addhead'?$('#ingRows .erow:last-child .in'):$('#stepRows .srow:last-child .in');if(last)last.focus();return}
    rerenderRows()});
  bindTags();bindIngCombo();
  $('#f-name').addEventListener('input',e=>{const L=fileLetter(e.target.value);$('#nameHelp').textContent=e.target.value.trim()?`Will be filed under ${L==='#'?'# (numbers)':L}.`:'Filed under the first letter or number of the name.'});}
let tagSel=0;
function tagOptions(q){const d=S.draft;const ql=q.trim().toLowerCase();const used=new Set(d.tags.map(t=>t.toLowerCase()));
  const count=t=>S.box.recipes.filter(r=>(r.tags||[]).includes(t)).length;
  let opts=S.box.tags.filter(t=>!used.has(t.toLowerCase())&&(!ql||t.toLowerCase().includes(ql)));
  opts.sort((a,b)=>ql?((b.toLowerCase().startsWith(ql))-(a.toLowerCase().startsWith(ql))||collator.compare(a,b)):(count(b)-count(a)));
  opts=opts.slice(0,8).map(t=>({t}));
  if(ql&&!S.box.tags.some(t=>t.toLowerCase()===ql)&&!used.has(ql))opts.push({t:q.trim(),isNew:true});return opts}
function drawTagMenu(){const inp=$('#tagIn'),menu=$('#tagMenu');if(!inp||!menu)return;const opts=tagOptions(inp.value);
  if(!opts.length||document.activeElement!==inp){menu.hidden=true;inp.setAttribute('aria-expanded','false');return}
  tagSel=Math.min(tagSel,opts.length-1);menu.hidden=false;inp.setAttribute('aria-expanded','true');
  menu.innerHTML=opts.map((o,k)=>`<div class="opt ${o.isNew?'new':''}" role="option" id="topt${k}" data-k="${k}" aria-selected="${k===tagSel}">${o.isNew?'+ Create a new category: “'+esc(o.t)+'”':esc(o.t)}</div>`).join('');
  inp.setAttribute('aria-activedescendant','topt'+tagSel);menu.__opts=opts}
function addTag(t){const d=S.draft;const ex=S.box.tags.find(x=>x.toLowerCase()===t.toLowerCase())||t.trim();if(!ex)return;if(!d.tags.some(x=>x.toLowerCase()===ex.toLowerCase()))d.tags.push(ex);refreshTagbox(true)}
function refreshTagbox(focus){$('#tagbox').innerHTML=tagboxInner();bindTagInput();tagSel=0;if(focus){$('#tagIn').focus()}drawTagMenu()}
function bindTagInput(){const inp=$('#tagIn');if(!inp)return;
  inp.addEventListener('input',()=>{tagSel=0;drawTagMenu()});inp.addEventListener('focus',drawTagMenu);
  inp.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==inp){const m=$('#tagMenu');if(m)m.hidden=true;inp.setAttribute('aria-expanded','false')}},120));
  inp.addEventListener('keydown',e=>{const m=$('#tagMenu');const opts=(m&&m.__opts)||[];

/* ---------- import ---------- */
const UNITMAP=[[/^(cups?|c\.?)$/i,'cup'],[/^(tablespoons?|tbsps?\.?|tbls?\.?|tblsp\.?|T)$/,'Tbsp'],[/^(teaspoons?|tsps?\.?|t)$/,'tsp'],[/^(ounces?|oz\.?)$/i,'oz'],[/^(fl\.? ?oz\.?|fluid ounces?)$/i,'fl oz'],[/^(pounds?|lbs?\.?)$/i,'lb'],
 [/^(grams?|g)$/i,'g'],[/^(kilograms?|kgs?)$/i,'kg'],[/^(milliliters?|millilitres?|ml)$/i,'ml'],[/^(liters?|litres?|l)$/i,'liter'],[/^(pinch(es)?)$/i,'pinch'],[/^(dash(es)?)$/i,'dash'],[/^(splash(es)?)$/i,'splash'],
 [/^(cloves?)$/i,'clove'],[/^(cans?)$/i,'can'],[/^(sticks?)$/i,'stick'],[/^(bunch(es)?)$/i,'bunch'],[/^(heads?)$/i,'head'],[/^(slices?)$/i,'slice'],[/^(packages?|pkgs?\.?|packets?)$/i,'package'],[/^(bottles?)$/i,'bottle'],[/^(pints?|pt)$/i,'pint'],[/^(quarts?|qt)$/i,'quart'],[/^(gallons?|gal)$/i,'gallon']];
const UFR={'½':' 1/2','⅓':' 1/3','⅔':' 2/3','¼':' 1/4','¾':' 3/4','⅛':' 1/8','⅜':' 3/8','⅝':' 5/8','⅞':' 7/8','⅕':' 1/5','⅙':' 1/6'};
const SMALLW=['and','or','of','in','with','for','the','a','to'];
function titleCase(s){return s.trim().split(/\s+/).map((w,k)=>k&&SMALLW.includes(w.toLowerCase())?w.toLowerCase():w.charAt(0).toUpperCase()+w.slice(1)).join(' ')}
const fold=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const ING_SYN={'pepper':'Black Pepper','ground pepper':'Black Pepper','ground black pepper':'Black Pepper','black pepper':'Black Pepper','eggs':'Egg','egg':'Egg','scallion':'Green Onion','scallions':'Green Onion','green onions':'Green Onion'};
const DESCR=/^(ground|fresh|freshly|frozen|dried|diced|chopped|minced|shredded|grated|sliced|crushed|melted|softened|cooked|canned|whole|boneless|skinless|finely|roughly|thinly|large|medium|small|ripe|packed|unsalted|salted|plain|raw|peeled|seeded)\b\s*/i;
function findIng(k){const L=S.box.ingredients;const f=fold(k);if(ING_SYN[f]){const s=L.find(x=>fold(x)===fold(ING_SYN[f]));if(s)return s}
  let m=L.find(x=>fold(x)===f);if(m)return m;const sing=f.replace(/ies$/,'y').replace(/(oes|ches|shes)$/,s=>s.slice(0,-2)).replace(/([^s])s$/,'$1');
  m=L.find(x=>fold(x)===sing)||L.find(x=>fold(x)===f+'s'||fold(x)===sing+'s');return m||null}
function matchIngNote(name){let n=name.trim(),notes=[];let m=findIng(n);if(m)return {i:m,n:''};
  let rest=n;while(DESCR.test(rest)){const w=rest.match(DESCR)[0];notes.push(w.trim().toLowerCase());rest=rest.slice(w.length);m=findIng(rest);if(m)return {i:m,n:notes.join(' ')}}
  return {i:titleCase(n),n:''}}
function matchIng(name){return matchIngNote(name).i}
function parseIngLine(raw){let s=raw.replace(/^[\s•\-–*▢☐□◻▪·]+/,'').replace(/[½⅓⅔¼¾⅛⅜⅝⅞⅕⅙]/g,c=>UFR[c]).replace(/(\d)\s+(?=\d\/)/g,'$1 ').replace(/\s+/g,' ').trim();
  const out={qt:'',u:'',i:'',n:''};const q=s.match(/^((?:\d+\s+)?\d+\/\d+|\d+(?:\.\d+)?)(?:\s*(?:-|–|to)\s*((?:\d+\s+)?\d+\/\d+|\d+(?:\.\d+)?))?\s*/);
  if(q){out.qt=q[2]?q[1].trim()+' to '+q[2].trim():q[1].trim();s=s.slice(q[0].length)}
  let paren='';const pm=s.match(/^\(([^)]*)\)\s*/);if(pm){paren=pm[1];s=s.slice(pm[0].length)}
  const w2=s.split(' ').slice(0,2).join(' '),w1=s.split(' ')[0]||'';
  let hit=UNITMAP.find(([re])=>re.test(w2.replace(/[.,]$/,'')));let used=w2;if(!hit||!/\s/.test(w2)){hit=UNITMAP.find(([re])=>re.test(w1.replace(/[,]$/,'')));used=w1}
  if(hit&&s.length>used.length){out.u=hit[1];s=s.slice(used.length).trim()}
  s=s.replace(/^of\s+/i,'');let note=[];const sz=s.match(/^(large|medium|small|extra[- ]large|jumbo)\s+/i);if(sz){note.push(sz[1].toLowerCase());s=s.slice(sz[0].length)}
  const ci=s.search(/,|\s\(|\s-\s|\s–\s/);let name=s,rest='';if(ci>0){name=s.slice(0,ci);rest=s.slice(ci).replace(/^[\s,(\-–]+/,'').replace(/\)$/,'')}
  if(paren)note.unshift(paren);if(rest)note.push(rest);
  if(/^(to taste|as needed)$/i.test(rest)){}
  const tail=name.match(/\s+(to taste|as needed|for serving|for garnish|optional)$/i);if(tail){note.push(tail[1].toLowerCase());name=name.slice(0,tail.index)}
  if(name){const mm=matchIngNote(name);out.i=mm.i;if(mm.n)note.unshift(mm.n)}out.n=note.join(', ');if(!out.qt&&['pinch','dash','splash'].includes(out.u))out.qt='1';return out}
function parseIngLines(raw){const o=parseIngLine(raw);const sp=o.i.split(/\s+and\s+/i);
  if(!o.qt&&sp.length===2){const a=findIng(sp[0]),b=findIng(sp[1]);if(a&&b)return [{qt:'',u:'',i:a,n:o.n},{qt:'',u:'',i:b,n:o.n}]}return [o]}
function parseTime(s){const h=s.match(/(\d+(?:\.\d+)?)\s*(hours?|hrs?|h)\b/i),m=s.match(/(\d+)\s*(minutes?|mins?|m)\b/i);const v=(h?parseFloat(h[1])*60:0)+(m?parseInt(m[1],10):0);return v||null}
function parseRecipeText(text,link){const lines=text.replace(/\r/g,'').split('\n').map(l=>l.trim());
  const isIngH=l=>/^(ingredients?|what you'?ll need|you will need)\s*:?$/i.test(l),isStepH=l=>/^(instructions?|directions?|method|steps|preparation|how to make( it)?)\s*:?$/i.test(l),isNoteH=l=>/^(notes?|tips?|recipe notes?|cook'?s notes?)\s*:?$/i.test(l);

  else if(a==='jump'){e.preventDefault();const el=document.getElementById(v);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
  else if(a==='serv'&&r){const cur=S.servings[r.id]??r.serv;S.servings[r.id]=Math.max(1,Math.min(200,Math.round(cur)+ +v));render()}
  else if(a==='fav'&&r){r.fav=!r.fav;if(!r.fav)delete r.fav;r.updated=nowISO();persist();render()}
  else if(a==='diff'&&r){const v2=+v;r.diff=r.diff===v2?undefined:v2;if(!r.diff)delete r.diff;r.updated=nowISO();persist();render();toast(r.diff?'Difficulty set to '+DIFF[r.diff-1]:'Difficulty cleared')}
  else if(a==='dreset'){S.dmin=1;S.dmax=5;S.dunr=true;render()}
  else if(a==='doinstall'&&installEvt){installEvt.prompt();installEvt.userChoice.then(()=>{installEvt=null;render()})}
  else if(a==='howinstall'){S.showHow=!S.showHow;render()}
  else if(a==='hideinstall'){try{localStorage.setItem('rb-install-hide','1')}catch(e){}render();toast('You can still find install steps in the settings menu')}
  else if(a==='syncpop'){openSyncPop(b)}
  else if(a==='syncnow'){const p=$('.syncpop');p&&p.remove();syncTap()}
  else if(a==='syncfix'){const p=$('.syncpop');p&&p.remove();conflictDlg()}
  else if(a==='cart'){openCart(b)}
  else if(a==='doneshop'){const before=JSON.stringify(S.box.shop);const n=shopStats().done;clearChecked();persist();closeCart();render();toast(`Cleared ${n} checked ${n===1?'item':'items'}`,{label:'Undo',fn:()=>{S.box.shop=JSON.parse(before);persist();render()}})}
  else if(a==='addshop'&&r){addToShop(r.id,S.servings[r.id]??r.serv);toast('Added to your shopping list');render()}
  else if(a==='addplan'&&r){planDialog({id:r.id})}
  else if(a==='planadd'){planDialog({day:v})}
  else if(a==='plandel'){const [k,ix]=v.split('|');S.box.plan[k].splice(+ix,1);if(!S.box.plan[k].length)delete S.box.plan[k];persist();render()}
  else if(a==='wk'){S.week=+v===0?weekStart(new Date()):addDays(S.week||weekStart(new Date()),+v);render()}
  else if(a==='planshop'){const ws=S.week||weekStart(new Date());const want={};for(let k=0;k<7;k++)(S.box.plan[dkey(addDays(ws,k))]||[]).forEach(e=>{const r2=byId(e.id);if(r2)want[e.id]=(want[e.id]||0)+(r2.serv||1)});
    let added=0,had=0;Object.entries(want).forEach(([id,sv])=>{const ex=S.box.shop.recipes.find(x=>x.id===id);const r2=byId(id);if(ex){if((ex.serv||0)>=sv&&r2.serv)had++;else{ex.serv=r2.serv?sv:null;added++}}else{S.box.shop.recipes.push({id,serv:r2.serv?sv:null});added++}});persist();
    toast(added?`${added} ${added===1?'recipe':'recipes'} added to your shopping list${had?`, ${had} already there`:''}`:'Everything this week is already on your shopping list');render()}
  else if(a==='shopcheck'){const k=v;if(b.checked)S.box.shop.checked[k]=true;else delete S.box.shop.checked[k];persist();const cw=$('.cartwrap');if(cw)cw.innerHTML=cartButton(route().name==='shop');const sl=$('#shopLeft');if(sl){const its=shopItems();const vis=its.filter(i=>!S.box.shop.removed[i.key]);sl.textContent=`${vis.filter(i=>!S.box.shop.checked[i.key]).length} of ${vis.length} items left to get.`}return}
  else if(a==='shopremove'){S.box.shop.removed[v]=true;delete S.box.shop.checked[v];persist();const it=shopItems().find(i=>i.key===v);toast((it?it.i:'Item')+' removed from the list');render()}
  else if(a==='shopputback'){delete S.box.shop.removed[v];persist();render()}
  else if(a==='shopdelrec'){S.box.shop.recipes=S.box.shop.recipes.filter(e=>e.id!==v);persist();render()}
  else if(a==='shopdelx'){S.box.shop.extra.splice(+v,1);persist();render()}
  else if(a==='shopclearchecked'){clearChecked();persist();render()}
  else if(a==='shopclear'){confirmDlg('Clear the whole list?','Every item and recipe on the shopping list will be removed.','Clear list',()=>{S.box.shop={recipes:[],extra:[],checked:{},removed:{}};persist();render()})}
  else if(a==='shopcopy'){const t=shopText();(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Shopping list copied')).catch(async()=>{if(canSave()){try{await saveFile('shopping-list.txt',t,'text/plain');toast('Shopping list saved')}catch(e){toast('Copy is not available here. Try Print instead.')}}else toast('Copy is not available here. Try Print instead.')})}
  else if(a==='doimport'){const t=$('#impText').value;if(!t.trim()){$('#impMsg').textContent='Paste a recipe into the box first.';$('#impText').focus();return}
    const mm=t.match(/RBX1\.([A-Za-z0-9_-]+)\./);const pd=mm?draftFromPayload(mm[1]):null;if(pd){if($('#impLink').value.trim())pd.link=$('#impLink').value.trim();pd.__for='new';S.draft=pd;tryGrabPhoto(pd.__img);toast(`Found ${pd.ing.filter(l=>l.i).length} ingredients and ${pd.steps.filter(s=>s.t).length} steps`);go('/new');return}
    const d=parseRecipeText(t,$('#impLink').value);d.__for='new';S.draft=d;const ni=d.ing.filter(l=>l.i).length,ns=d.steps.filter(s=>s.t).length;toast(`Found ${ni} ingredients and ${ns} steps`);go('/new')}
  else if(a==='doprint'){window.print()}
  else if(a==='print')window.print();
  else if(a==='cook'&&r)startCook(r);
  else if(a==='cooknext'){S.cook.i++;drawCook()}
  else if(a==='cookprev'){S.cook.i--;drawCook()}
  else if(a==='cookexit')stopCook();
  else if(a==='timer')addTimer(+v,b.dataset.l);
  else if(a==='timerdel'){const t=S.cook.timers[+v];clearInterval(t.h);S.cook.timers.splice(+v,1);$('#runTimers').innerHTML=timerChips()}
  else if(a==='settings')settingsDlg();});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form==='shopadd'){e.preventDefault();const v=$('#shopNew').value.trim();if(v){S.box.shop.extra.push({t:v});persist();render();$('#shopNew').focus()}}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(!b)return;if(b.dataset.w==='seed')startBox(freshBox(true));if(b.dataset.w==='empty')startBox(freshBox(false))});
document.addEventListener('change',e=>{if(e.target.id!=='wfile')return;const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);const box=j.box||j;if(!Array.isArray(box.recipes))throw 0;startBox(box);toast('Backup restored')}catch(err){toast("That file isn't a Recipe Box backup")}};fr.readAsText(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.cartpop')){closeCart();const cb=$('.cartbtn');cb&&cb.focus();return}if(e.key==='Escape'){const sc=$('.scrim');if(sc){sc.remove();return}}if(!S.cook)return;
  if(e.key==='ArrowRight'&&S.cook.i<S.cook.flat.length-1){S.cook.i++;drawCook()}else if(e.key==='ArrowLeft'&&S.cook.i>0){S.cook.i--;drawCook()}else if(e.key==='Escape')stopCook()});
let tx=null;document.addEventListener('touchstart',e=>{if(S.cook)tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(!S.cook||tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)<70)return;if(dx<0&&S.cook.i<S.cook.flat.length-1){S.cook.i++;drawCook()}else if(dx>0&&S.cook.i>0){S.cook.i--;drawCook()}},{passive:true});
document.addEventListener('visibilitychange',()=>{if(S.cook&&document.visibilityState==='visible'&&wake===null)tryWake()});
document.addEventListener('toggle',e=>{if(e.target.id==='diffdet')S.diffOpen=e.target.open},true);
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.pf==='field'){printEvents(byId(route().id),e);return}if(t.id==='dmin'||t.id==='dmax'){S.letter=null;render();const el=$('#'+t.id);if(el)el.focus()}else if(t.id==='dunr'){S.dunr=t.checked;S.letter=null;render();const el=$('#dunr');if(el)el.focus()}});
window.addEventListener('pagehide',()=>{if(saveTimer){clearTimeout(saveTimer);kvSet('box',S.box)}});
let rsz=null;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(route().name==='print'&&byId(route().id))drawPrint(byId(route().id))},150)});
window.addEventListener('hashchange',()=>{const r=route();if(r.name!=='edit'&&r.name!=='new'&&!(r.name==='import'&&r.id))S.draft=null;if(S.cook)stopCook();render();window.scrollTo(0,0)});

function getTheme(){try{return localStorage.getItem('rb-theme')||'light'}catch(e){return 'light'}}
function applyTheme(t){const el=document.documentElement;if(t==='auto')el.removeAttribute('data-theme');else el.setAttribute('data-theme',t);try{localStorage.setItem('rb-theme',t)}catch(e){}}
applyTheme(getTheme());
/* ---------- boot ---------- */
(async function(){try{DB=await idb()}catch(e){DB=null;persistOK=false}
  let box=await kvGet('box');if(box&&Array.isArray(box.recipes))S.box=ensureBox(box);else if(!STANDALONE){box=freshBox(true);S.box=ensureBox(box);if(DB){persistOK=await kvSet('box',box)}}
  render();
  try{if(window.claude&&claude.use){downloads=await claude.use('downloads')}}catch(e){downloads=null}
  if(STANDALONE&&'serviceWorker' in navigator){try{await navigator.serviceWorker.register('./sw.js')}catch(e){}}
  if(STANDALONE&&S.box){await syncLoad();const back=await oauthFinish();if(SY.st){render();if(!back)runSync(false)}}
  window.addEventListener('online',()=>scheduleSync(500));window.addEventListener('offline',()=>{if(SY.st)setSync('offline')});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SY.st)scheduleSync(800)});
})();
})();

</script>
</body>
